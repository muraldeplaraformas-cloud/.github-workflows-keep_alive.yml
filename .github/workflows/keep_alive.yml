name: Absolute Force Wakeup with Alert

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  physical-click:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Force Physical Interaction
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({width: 390, height: 844});
            
            try {
              console.log('Tentativa de acesso: ' + new Date().toISOString());
              const response = await page.goto('https://unable-to-assist-2.preview.emergentagent.com/', { 
                waitUntil: 'networkidle2',
                timeout: 45000 
              });

              // ALERTA 1: Verifica se o site sequer respondeu
              if (!response || response.status() >= 400) {
                throw new Error('SITE FORA DO AR! Status: ' + (response ? response.status() : 'Sem Resposta'));
              }
              
              await new Promise(r => setTimeout(r, 8000));

              // Dispara os cliques físicos
              const locations = [{x: 195, y: 700}, {x: 195, y: 710}];
              for (const loc of locations) {
                await page.mouse.click(loc.x, loc.y);
              }

              console.log('Interação concluída com sucesso.');

            } catch (e) {
              console.error('ALERTA DE FALHA: ' + e.message);
              process.exit(1); // Força o GitHub a mostrar o ícone VERMELHO de erro
            } finally {
              await browser.close();
            }
          })();
          "
