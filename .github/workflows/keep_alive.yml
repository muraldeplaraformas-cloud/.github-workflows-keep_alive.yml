name: Ultimate Wake Up (No-Sleep Mode)

on:
  schedule:
    - cron: '*/4 * * * *' # Agora a cada 4 minutos para não dar chance ao sono
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Execute Deep Search and Click
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ 
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox'] 
            });
            const page = await browser.newPage();
            // Define um tamanho de tela de celular moderno
            await page.setViewport({width: 390, height: 844});
            
            try {
              console.log('Navegando... [' + new Date().toLocaleTimeString() + ']');
              await page.goto('https://unable-to-assist-2.preview.emergentagent.com/', { 
                waitUntil: 'networkidle0', 
                timeout: 30000 
              });
              
              await new Promise(r => setTimeout(r, 5000)); // Espera 5s para o overlay carregar

              // Tenta clicar no botão mesmo que ele esteja escondido em Iframes ou Shadow DOM
              const clicked = await page.evaluate(() => {
                const clickAnywhereWithText = (root, text) => {
                  const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
                  let node;
                  while(node = walker.nextNode()) {
                    if (node.tagName === 'BUTTON' || node.tagName === 'A' || node.tagName === 'DIV') {
                      if (node.innerText && node.innerText.toLowerCase().includes(text.toLowerCase())) {
                        node.click();
                        return true;
                      }
                    }
                  }
                  return false;
                };
                
                // Procura na página principal
                let found = clickAnywhereWithText(document.body, 'Wake up');
                
                // Se não achou, procura dentro de todos os Iframes
                if (!found) {
                  const iframes = document.querySelectorAll('iframe');
                  for (const f of iframes) {
                    try {
                      found = clickAnywhereWithText(f.contentDocument.body, 'Wake up');
                      if (found) break;
                    } catch(e) {}
                  }
                }
                return found;
              });

              console.log(clicked ? 'BOTÃO CLICADO COM SUCESSO!' : 'Botão não visível (Sistema deve estar ativo).');
              
              // Garante que a requisição de despertar seja enviada
              await new Promise(r => setTimeout(r, 8000));

            } catch (error) {
              console.error('Erro na tentativa:', error.message);
            } finally {
              await browser.close();
            }
          })();
          "
