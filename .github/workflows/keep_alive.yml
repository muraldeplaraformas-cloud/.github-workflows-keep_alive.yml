name: Perpetual Wake (Phantom User)

on:
  schedule:
    - cron: '*/5 * * * *' # Executa a cada 5 minutos
  workflow_dispatch:

jobs:
  stay-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Execute Human Behavior Simulation
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ 
              headless: 'new', 
              args: ['--no-sandbox', '--disable-setuid-sandbox'] 
            });
            const page = await browser.newPage();
            // Simula um iPhone X para manter a consistência do layout
            await page.setViewport({ width: 375, height: 812, isMobile: true });

            try {
              console.log('Iniciando simulação de vida no site...');
              await page.goto('https://play-links.preview.emergentagent.com/', { waitUntil: 'networkidle2' });

              // 1. Tenta clicar no botão de Wake Up se ele existir
              const wakeButton = await page.evaluate(() => {
                const btn = Array.from(document.querySelectorAll('button')).find(b => b.innerText.includes('Wake up'));
                if (btn) { btn.click(); return true; }
                return false;
              });
              if (wakeButton) console.log('Botão Wake Up acionado.');

              // 2. Loop de Interação de 2 minutos (Isso impede o Sleep imediato)
              for (let i = 0; i < 12; i++) {
                // Rola para baixo aleatoriamente
                const scroll = Math.floor(Math.random() * 500);
                await page.evaluate((s) => window.scrollBy(0, s), scroll);
                
                // Move o mouse para uma posição aleatória
                await page.mouse.move(Math.random() * 375, Math.random() * 812);
                
                console.log('Interação ' + (i+1) + ' realizada...');
                await new Promise(r => setTimeout(r, 10000)); // Espera 10 segundos entre movimentos
              }

              console.log('Ciclo de vida concluído. Servidor deve permanecer ativo.');

            } catch (e) {
              console.error('Falha na persistência:', e.message);
            } finally {
              await browser.close();
            }
          })();
          "
