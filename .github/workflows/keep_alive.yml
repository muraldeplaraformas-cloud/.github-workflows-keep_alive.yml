name: Absolute Force Wakeup (Physical Click)

on:
  schedule:
    - cron: '*/5 * * * *' # Voltamos para 5 min para garantir pressão constante
  workflow_dispatch:

jobs:
  physical-click:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Force Physical Interaction
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox'] });
            const page = await browser.newPage();
            // Simulamos um celular para o botão ficar exatamente onde vimos no seu print
            await page.setViewport({width: 390, height: 844});
            
            try {
              console.log('Navegando até o alvo...');
              await page.goto('https://unable-to-assist-2.preview.emergentagent.com/', { waitUntil: 'networkidle2' });
              
              await new Promise(r => setTimeout(r, 8000)); // Espera o banner carregar bem

              // Em vez de procurar o botão pelo nome, vamos clicar na área onde ele aparece no print
              // No viewport 390x844, o botão de Wakeup costuma ficar na metade inferior.
              console.log('Disparando cliques em massa na área do botão...');
              
              const locations = [
                {x: 195, y: 700}, // Centro inferior
                {x: 195, y: 710},
                {x: 195, y: 690}
              ];

              for (const loc of locations) {
                await page.mouse.click(loc.x, loc.y);
                console.log('Clique físico enviado para: ' + loc.x + ',' + loc.y);
                await new Promise(r => setTimeout(r, 1000));
              }

              // Tentativa bônus: Tentar clicar pelo seletor de classe que o Emergent costuma usar
              await page.evaluate(() => {
                const buttons = Array.from(document.querySelectorAll('button, div, span'));
                const target = buttons.find(el => el.innerText && el.innerText.toLowerCase().includes('wake up'));
                if (target) {
                  target.scrollIntoView();
                  target.click();
                }
              });

              console.log('Processo finalizado. Verifique o site agora.');
              await new Promise(r => setTimeout(r, 5000));

            } catch (e) {
              console.log('Erro: ' + e.message);
            } finally {
              await browser.close();
            }
          })();
          "
