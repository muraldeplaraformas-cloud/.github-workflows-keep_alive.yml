name: Force Wake Up (Click Button)

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Execute Click and Wake Up
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ 
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox'] 
            });
            const page = await browser.newPage();
            try {
              console.log('Navegando até o site...');
              await page.goto('https://unable-to-assist-2.preview.emergentagent.com/', { waitUntil: 'networkidle2' });
              
              console.log('Procurando pelo botão Wake up servers...');
              
              // Espera o botão aparecer na tela
              await page.waitForSelector('button', { timeout: 10000 });

              // Lógica para encontrar o botão pelo texto exato e clicar
              const clicked = await page.evaluate(() => {
                const buttons = Array.from(document.querySelectorAll('button'));
                const wakeButton = buttons.find(btn => btn.innerText.includes('Wake up servers'));
                if (wakeButton) {
                  wakeButton.click();
                  return true;
                }
                return false;
              });

              if (clicked) {
                console.log('Sucesso! O botão foi clicado.');
                // Espera 10 segundos após o clique para o backend processar a ativação
                await new Promise(r => setTimeout(r, 10000));
              } else {
                console.log('Botão não encontrado (talvez o servidor já estivesse acordado).');
              }

            } catch (error) {
              console.error('Erro durante a execução:', error.message);
            } finally {
              await browser.close();
            }
          })();
          "
