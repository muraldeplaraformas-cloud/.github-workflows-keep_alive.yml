name: Deep Wake Up (Simulated Browser)

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Simulando Visita Completa
        run: |
          # Usamos o User-Agent para parecer um navegador real
          # O parâmetro -L segue redirecionamentos (importante para telas de wakeup)
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36" \
          https://unable-to-assist-2.preview.emergentagent.com/ \
          -o /dev/null -s -w "Status da Visita: %{http_code}\n"
