name: Keep Alive & Metrics Tracker

on:
  schedule:
    # Executa a cada 6 horas para registrar as métricas
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update metrics
        run: |
          # Cria o arquivo de métricas se ele não existir
          if [ ! -f metrics.json ]; then
            echo '{"total_pings": 0, "last_ping": ""}' > metrics.json
          fi

          # Lê o contador atual
          CURRENT_COUNT=$(jq '.total_pings // 0' metrics.json)
          NEW_COUNT=$((CURRENT_COUNT + 1))
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Atualiza as chaves total_pings e last_ping no arquivo JSON
          jq --arg count "$NEW_COUNT" --arg date "$NOW" '.total_pings = ($count | tonumber) | .last_ping = $date' metrics.json > temp.json && mv temp.json metrics.json

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics.json
          git commit -m "update: métricas [skip ci]" || exit 0
          git push
